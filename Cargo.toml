[package]
name = "gem-player"
version = "1.2.0"
edition = "2024"
description = "A lightweight music player."
build = "build.rs"
repository = "https://github.com/JamesMoreau/gem-player"
authors = ["James Moreau"]

[dependencies]
anyhow = "1.0.104"
dark-light = "3.0.0"
directories = "6.0.0"
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
egui_material_icons = "0.8.0"
egui-toast = "0.22.0"
env_logger = { version = "0.11.11", default-features = false, features = [
	"auto-color",
	"humantime",
] }
font-kit = "0.14.3"
fully_pub = "0.1.5"
image = "0.25.10"
lofty = "0.25.5"
log = "0.4.35"
m3u = "1.0.0"
mimalloc = "0.1.52"
muda = "0.21.2"
nosleep = "0.2.1"
notify = "8.2.2"
notify-debouncer-mini = "0.7.0"
opener = { version = "0.9.0", features = ["reveal"] }
rand = "0.10.3"
rayon = "1.12.0"
rfd = "0.18.0"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
rust-i18n = "4.2.4"
rustfft = "6.4.1"
sanitize-filename = "0.6.0"
serde = "1.0.229"
serde_json = "1.0.151"
souvlaki = "0.9.3"
strum = "0.28.0"
strum_macros = "0.28.0"
sys-locale = "0.3.2"
trash = "5.3.0"
walkdir = "2.5.0"

[patch.crates-io]
winit = { path = "vendor/winit" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-scoped-bookmarks = { version = "0.1.0", optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"
ico = "0.6.0"
image = "0.25.10"

[features]
default = []
app-store = ["dep:apple-scoped-bookmarks"]

[package.metadata.bundle]
name = "Gem Player"
identifier = "com.jamesmoreau.gemplayer"
icon = ["assets/icon.icns"]
category = "public.app-category.music"

[package.metadata.bundle.osx]
minimum_system_version = "13.0"
